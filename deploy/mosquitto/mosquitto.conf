# Mosquitto configuration for the Docker Compose deployment.
#
# Lab setup: anonymous access, but only inside the private Compose network.
# Port 1883 is NOT published to the host. For production, enable TLS and
# authentication (see docs/DEPLOYMENT.md, "Production checklist").

listener 1883
allow_anonymous true

# Only live values matter; the simulator republishes its retained status on reconnect.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
